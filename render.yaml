services:
  - name: ledger-lite
    type: web
    runtime: node
    plan: free
    buildCommand: corepack pnpm@10 install && (corepack pnpm@10 approve-builds --all || true) && corepack pnpm@10 --filter @workspace/ledger run build && corepack pnpm@10 --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
